<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday.exe ♡</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="sparkle s1">✦</div>
  <div class="sparkle s2">♡</div>
  <div class="sparkle s3">✧</div>
  <div class="sparkle s4">♥</div>

  <main class="computer">

    <div class="topbar">
      <span>♡ SUNAKO.EXE ♡</span>
      <div class="window-buttons">
        <button>_</button>
        <button>□</button>
        <button>×</button>
      </div>
    </div>

    <section class="screen">

      <div class="desktop-icon">
        <div class="icon">💌</div>
        <span>birthday.exe</span>
      </div>

      <div class="welcome-window">

        <div class="window-title">
          <span>♡ Welcome ♡</span>
          <span>×</span>
        </div>

        <div class="window-content">

          <div class="computer-heart">♡</div>

          <h1>HELLO, BBG!</h1>

          <p class="tiny">a very important message...</p>

          <div class="loading-box">
            <div class="loading-bar"></div>
          </div>

          <p class="loading-text">loading something special...</p>

          <button class="enter" onclick="location.href='page2.html'">
            OPEN ♡
          </button>

        </div>

      </div>

   

    </section>

    <div class="taskbar">
      <div class="start">♡ START</div>
      <div class="task">page.exe</div>
      <div class="time">12:00 AM ♡</div>
    </div>

  </main>

</body>
</html>
